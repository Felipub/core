<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
<LocationMatch "(?i)^/(dev|tests|installer|cli|mysqltosheets|vendor|var|resources/templates/cache)(/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(^config.*\.php$|\.sql(\.gz)?$|^composer\.|^error_log$|\.log$)">
    Require all denied
</FilesMatch>
Header always set Content-Security-Policy "default-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; form-action 'self'; frame-src 'self'"
