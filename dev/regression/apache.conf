Listen 8081
Listen 8082
<VirtualHost *:8081 *:8082>
    DocumentRoot /var/www/html
    LimitRequestFieldSize 32768
</VirtualHost>
<Directory /var/www/html>
    # Ignore tracked cPanel handlers and session paths identically in both snapshots.
    AllowOverride None
    Require all granted
</Directory>
<Directory /var/www/html/uploads>
    <FilesMatch "(?i)\.(js|htm|html|css|php[0-9]?|phtml|asp|jsp|py)$">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "(?i)^/(dev|tests|installer|cli|mysqltosheets|vendor|var|resources/templates/cache)(/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(^\.|^config.*\.php$|\.sql(\.gz)?$|^composer\.|^error_log$|\.(log|ini|sh|bak)$)">
    Require all denied
</FilesMatch>
Header always set Content-Security-Policy "default-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; form-action 'self'; frame-src 'self'"
