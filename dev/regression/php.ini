date.timezone=UTC
session.name=CORE_${SANDBOX_INSTANCE}
session.save_path=/var/www/html/var/sessions
upload_tmp_dir=/var/www/html/var/tmp
sys_temp_dir=/var/www/html/var/tmp
log_errors=On
error_log=/var/www/html/var/php-error.log
display_errors=Off
memory_limit=256M
max_execution_time=60
max_input_time=90
max_input_vars=6000
post_max_size=260M
upload_max_filesize=256M
session.gc_maxlifetime=1440
zlib.output_compression=Off
sendmail_path=/bin/false
allow_url_fopen=Off
expose_php=Off
