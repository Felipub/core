name: core-regression
x-web: &web
  image: core-regression-php:7.4.33
  build: .
  user: "33:33"
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  security_opt: [no-new-privileges:true]
  environment: &environment
    TEST_ENV: codeception
    DB_HOST: db
    DB_NAME: regression
    DB_USERNAME: regression
    DB_PASSWORD: synthetic-local-only
  depends_on:
    db:
      condition: service_healthy
  networks: [sandbox]
x-db: &db
  image: mysql:5.7.44@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
  command: ["--sql-mode=NO_ENGINE_SUBSTITUTION", "--character-set-server=utf8", "--collation-server=utf8_general_ci"]
  environment:
    MYSQL_DATABASE: regression
    MYSQL_USER: regression
    MYSQL_PASSWORD: synthetic-local-only
    MYSQL_ROOT_PASSWORD: synthetic-root-only
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psynthetic-root-only --silent"]
    interval: 3s
    timeout: 3s
    retries: 40
services:
  db-master:
    <<: *db
    networks:
      master:
        aliases: [db]
    volumes: ["db-master:/var/lib/mysql"]
  db-manjeet:
    <<: *db
    networks:
      manjeet:
        aliases: [db]
    volumes: ["db-manjeet:/var/lib/mysql"]
  master:
    <<: *web
    environment:
      <<: *environment
      SANDBOX_INSTANCE: master
      ABSOLUTE_URL: http://127.0.0.1:8081
    networks: [master]
    depends_on:
      db-master: {condition: service_healthy}
    volumes: ["./.runtime/master:/var/www/html", "./:/harness:ro"]
  manjeet:
    <<: *web
    environment:
      <<: *environment
      SANDBOX_INSTANCE: manjeet
      ABSOLUTE_URL: http://127.0.0.1:8082
    networks: [manjeet]
    depends_on:
      db-manjeet: {condition: service_healthy}
    volumes: ["./.runtime/manjeet:/var/www/html", "./:/harness:ro"]
  gateway-master:
    image: nginx:1.26.3-alpine@sha256:1eadbb07820339e8bbfed18c771691970baee292ec4ab2558f1453d26153e22d
    ports: ["127.0.0.1:8081:8081"]
    networks: [edge-master, master]
    depends_on: [master]
    volumes: ["./nginx-master.conf:/etc/nginx/conf.d/default.conf:ro"]
  gateway-manjeet:
    image: nginx:1.26.3-alpine@sha256:1eadbb07820339e8bbfed18c771691970baee292ec4ab2558f1453d26153e22d
    ports: ["127.0.0.1:8082:8082"]
    networks: [edge-manjeet, manjeet]
    depends_on: [manjeet]
    volumes: ["./nginx-manjeet.conf:/etc/nginx/conf.d/default.conf:ro"]
  browser-master:
    image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    profiles: [tools]
    working_dir: /tools
    user: pwuser
    ipc: private
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: {BASE_URL: "http://127.0.0.1:8081"}
    network_mode: service:master
    volumes: ["./.runtime/tools:/tools", "./:/harness:ro"]
    command: ["node", "-e", "console.log('Playwright ready; no functional tests defined')"]
  browser-manjeet:
    extends: browser-master
    environment: {BASE_URL: "http://127.0.0.1:8082"}
    network_mode: service:manjeet
networks:
  sandbox: {internal: true}
  master: {internal: true}
  manjeet: {internal: true}
  edge-master: {}
  edge-manjeet: {}
volumes:
  db-master:
  db-manjeet:
