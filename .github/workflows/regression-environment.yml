name: Isolated regression environment
on:
  workflow_dispatch:
  push:
    branches: ['dev/isolated-regression-environment-*']
    paths:
      - 'dev/regression/**'
      - 'tests/regression/**'
      - '.github/workflows/regression-environment.yml'
  pull_request:
    paths:
      - 'dev/regression/**'
      - 'tests/regression/**'
      - '.github/workflows/regression-environment.yml'
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned clean snapshots
        run: ./dev/regression/lab.ps1 prepare
      - name: Install locked dependencies and images
        run: ./dev/regression/lab.ps1 install
      - name: Start isolated applications
        run: ./dev/regression/lab.ps1 start
      - name: Reset synthetic fixtures
        run: ./dev/regression/lab.ps1 reset
      - name: Verify infrastructure, tools and synthetic logins
        run: ./dev/regression/lab.ps1 verify
      - name: Reset after use and verify repeatability
        run: |
          ./dev/regression/lab.ps1 reset
          ./dev/regression/lab.ps1 verify
      - name: Verify empty future runners
        run: |
          ./dev/regression/lab.ps1 reset
          ./dev/regression/lab.ps1 browser-tests
          ./dev/regression/lab.ps1 reset
          ./dev/regression/lab.ps1 codeception-tests
      - name: Capture container state
        if: always()
        run: |
          docker compose -f dev/regression/compose.yaml ps --all
          docker compose -f dev/regression/compose.yaml logs --no-color --tail=100
          docker compose -f dev/regression/compose.yaml exec -T master php -r 'if (is_file("var/php-error.log")) echo file_get_contents("var/php-error.log");'
          docker compose -f dev/regression/compose.yaml exec -T manjeet php -r 'if (is_file("var/php-error.log")) echo file_get_contents("var/php-error.log");'
      - name: Stop containers
        if: always()
        run: ./dev/regression/lab.ps1 stop
